<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Form Control</title>

   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
   <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
      integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
      crossorigin="anonymous"></script>
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
      integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
      crossorigin="anonymous"></script>


   
</head>

<body>

   <div class="container mt-3 bg-warning rounded-4">

      <div class="mt-4">
         <h2 class="text-center text-primary">FORMULIR PENDAFTARAN SISWA BARU</h2>
      </div>

      <div class="mb-3 form-floating">
         <input type="text" placeholder="Masukkan NIPD" class="form-control">
         <label>NIPD</label>
      </div>

      <div class="mb-3 form-floating">
         <input type="text" placeholder="Nama Lengkap" class="form-control">
         <label>Nama Lengkap</label>
      </div>

      <div class="mb-3 form-floating">
         <input type="text" placeholder="Email" class="form-control">
         <label>Email</label>
      </div>

      <div class="mb-3 form-floating">
         <textarea class="form-control" placeholder="Alamat Lengkap"></textarea>
         <label>Alamat Lengkap</label>
      </div>

      <div class="mb-3 form-floating">
         <select class="form-select">
            <option>Rekayasa Perangkat Lunak</option>
            <option>Teknik Komputer dan Jaringan</option>
            <option>Desain Komunikasi Visual</option>
            <option>Bisnis Digital</option>
            <option>Akuntansi</option>
         </select>
         <label>Pilih Jurusan</label>
      </div>

      <div class="mb-3">
         <input class="form-check-input" type="checkbox">
         <label class="form-check-label">Eskul Pramuka</label>

         <input class="form-check-input" type="checkbox">
         <label class="form-check-label">Eskul Paskibra</label>

         <input class="form-check-input" type="checkbox">
         <label class="form-check-label">Eskul PMR (Palang Merah Remaja)</label>
      </div>

      <div class="mb-3">
         <div class="row">
            <div class="col-6">
               <input class="form-check-input" type="radio" name="jk">
               <label class="form-check-label">Laki-laki</label>
            </div>
            <div class="col-6">
               <input class="form-check-input" type="radio" name="jk">
               <label class="form-check-label">Perempuan</label>
            </div>
         </div>
      </div>



   </div>


   <button type="button" class="btn btn-danger" data-bs-toggle="tooltip" data-bs-placement="top"
      data-bs-title="Untuk Simpan Data">Simpan Data</button>
   <button class="btn btn-success">Hapus Data</button>

   <button type="button" class="btn btn-secondary" data-bs-toggle="tooltip" data-bs-placement="top"
      data-bs-custom-class="custom-tooltip" data-bs-title="This top tooltip is themed via CSS variables.">
      Custom tooltip
   </button>


   <script>
      const tooltipTriggerList = document.querySelectorAll('[data-bs-toggle="tooltip"]')
      const tooltipList = [...tooltipTriggerList].map(tooltipTriggerEl => new bootstrap.Tooltip(tooltipTriggerEl))
   </script>
</body>

</html>
