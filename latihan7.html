<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>carousel</title>

   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"></script>
</head>

<body>

   <div class="container mt-4">


      <div id="contoh" class="carousel slide">

         <div class="carousel-inner">
            <div class="carousel-item active">
               <img height="400px;" class="rounded mx-auto d-block"
                  src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTdNUPMtTRidr9OBCxtcTyRdCqFxwDPVfFSBykMHfUIbhcrfdJ7Ok4R4e4&s=10">
            </div>

            <div class="carousel-item">
               <img height="400px;" class="rounded mx-auto d-block"
                  src="https://png.pngtree.com/thumb_back/fh260/background/20240731/pngtree-beautiful-landscape-of-a-rice-field-and-sky-in-the-village-image_15937834.jpg">
            </div>

            <div class="carousel-item">
               <img height="400px;" class="rounded mx-auto d-block"
                  src="https://img.lazcdn.com/g/p/273f7133e129d1c2e06f70945826e11a.jpg_720x720q80.jpg">
            </div>
         </div>

         <button class="carousel-control-prev" type="button" data-bs-target="#contoh" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
            <span class="visually-hidden">Prev</span>
         </button>

         <button class="carousel-control-next" type="button" data-bs-target="#contoh" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
            <span class="visually-hidden">Next</span>
         </button>

      </div>

   </div>
</body>

</html>
