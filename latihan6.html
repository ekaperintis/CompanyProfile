<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Modal</title>

   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</head>
<body>
   <div class="container mt-4">

      <button class="btn bg-warning" data-bs-toggle="modal" data-bs-target="#abc" >Tampilkan Dialog Modal</button>

   </div>



   <div class="modal fade" id="abc" aria-hidden="true">
      <div class="modal-dialog">
         <div class="modal-content">
            <div class="modal-header">
               <h5 class="modal-title text-primary">Pesan !</h5>
               <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
               <p class="text-danger">Selamat datang di Pemrograman Web dengan HTML dan CSS</p>
            </div>

            <div class="modal-footer">
               <button class="btn btn-danger">Simpan Data</button>
               <button class="btn btn-primary" data-bs-dismiss="modal">Tutup</button>
            </div>

         </div>
      </div>
   </div>
   
</body>
</html>
